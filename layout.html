<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eztool.pro - JSON Formatter & Validator</title>
    
    <!-- Google Fonts: Inter cho UI, Fira Code cho Editor -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (CDN cho bản Demo) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        slate: {
                            50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 
                            400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 
                            800: '#1e293b', 900: '#0f172a', 950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Tùy chỉnh Scrollbar cho đẹp gọn */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased h-screen flex overflow-hidden">

    <!-- SIDEBAR (Desktop) / Overlay Menu (Mobile) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-slate-200 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-200 ease-in-out flex flex-col">
        <!-- Logo -->
        <div class="h-14 flex items-center px-6 border-b border-slate-200">
            <span class="text-xl font-bold tracking-tight text-slate-900">eztool<span class="text-blue-600">.pro</span></span>
        </div>
        
        <!-- Navigation -->
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-6">
            <div>
                <h3 class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Dev Tools</h3>
                <ul class="space-y-1">
                    <li>
                        <a href="#" class="flex items-center px-3 py-2 text-sm font-medium bg-slate-100 text-blue-600 rounded-md">
                            <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                            JSON Formatter
                        </a>
                    </li>
                    <li>
                        <a href="#" class="flex items-center px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-md transition-colors">
                            <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                            Base64 Encode/Decode
                        </a>
                    </li>
                </ul>
            </div>

            <div>
                <h3 class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Văn Bản</h3>
                <ul class="space-y-1">
                    <li>
                        <a href="#" class="flex items-center px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-md transition-colors">
                            <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            Đếm Từ & Ký Tự
                        </a>
                    </li>
                </ul>
            </div>
            
            <div>
                <h3 class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Hình Ảnh</h3>
                <ul class="space-y-1">
                    <li>
                        <a href="#" class="flex items-center px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-md transition-colors">
                            <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                            Tạo QR Code
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
    </aside>

    <!-- Overlay cho Mobile -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden"></div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col min-w-0 bg-slate-50 h-screen overflow-hidden">
        
        <!-- Header -->
        <header class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-4 lg:px-8 flex-shrink-0">
            <div class="flex items-center">
                <button id="btn-menu" class="md:hidden mr-4 text-slate-500 hover:text-slate-900 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <nav class="hidden sm:flex" aria-label="Breadcrumb">
                    <ol class="flex items-center space-x-2 text-sm text-slate-500">
                        <li>Trang chủ</li>
                        <li><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></li>
                        <li>Dev Tools</li>
                        <li><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></li>
                        <li class="font-medium text-slate-900">JSON Formatter</li>
                    </ol>
                </nav>
            </div>

            <div class="flex items-center space-x-3">
                <!-- Search Mockup (Shadcn Command style) -->
                <button class="hidden sm:flex items-center justify-between w-64 px-3 py-1.5 text-sm bg-slate-100 text-slate-500 rounded-md border border-slate-200 hover:bg-slate-200/50 transition-colors">
                    <span class="flex items-center"><svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg> Tìm kiếm công cụ...</span>
                    <kbd class="hidden lg:inline-flex items-center font-mono text-[10px] font-medium opacity-100">
                        <span class="text-xs">Ctrl K</span>
                    </kbd>
                </button>
                
                <!-- Theme Toggle -->
                <button class="p-2 text-slate-500 hover:text-slate-900 rounded-md hover:bg-slate-100 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
        </header>

        <!-- Tool Workspace -->
        <div class="flex-1 overflow-y-auto p-4 lg:p-8">
            <div class="max-w-7xl mx-auto h-full flex flex-col">
                
                <!-- Tiêu đề công cụ -->
                <div class="mb-6 flex-shrink-0">
                    <h1 class="text-2xl font-bold tracking-tight text-slate-900">JSON Formatter & Validator</h1>
                    <p class="text-slate-500 text-sm mt-1">Làm đẹp, xác thực và nén dữ liệu JSON của bạn ngay lập tức.</p>
                </div>

                <!-- Action Bar -->
                <div class="flex flex-wrap gap-2 mb-4 flex-shrink-0">
                    <button id="btn-format" class="inline-flex items-center justify-center rounded-md text-sm font-medium bg-slate-900 text-white shadow hover:bg-slate-800 h-9 px-4 py-2 transition-colors">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                        Format (Làm đẹp)
                    </button>
                    <button id="btn-minify" class="inline-flex items-center justify-center rounded-md text-sm font-medium bg-white border border-slate-200 text-slate-900 hover:bg-slate-100 h-9 px-4 py-2 transition-colors shadow-sm">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                        Minify (Nén)
                    </button>
                    <button id="btn-clear" class="inline-flex items-center justify-center rounded-md text-sm font-medium bg-white border border-slate-200 text-red-600 hover:bg-red-50 hover:border-red-200 h-9 px-4 py-2 transition-colors shadow-sm ml-auto">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        Xóa trắng
                    </button>
                </div>

                <!-- Editors Layout (2 cột) -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 flex-1 min-h-[400px]">
                    
                    <!-- Khung Nhập (Input) -->
                    <div class="flex flex-col bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden relative">
                        <div class="h-10 border-b border-slate-200 bg-slate-50/50 flex items-center justify-between px-3 flex-shrink-0">
                            <span class="text-xs font-semibold text-slate-500 uppercase">Input</span>
                            <button id="btn-paste" class="text-xs text-slate-500 hover:text-slate-900 flex items-center transition-colors">
                                <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                                Paste
                            </button>
                        </div>
                        <textarea id="input-json" class="flex-1 w-full p-4 font-mono text-sm resize-none focus:outline-none focus:ring-inset focus:ring-2 focus:ring-blue-500/50 text-slate-800" placeholder='Dán dữ liệu JSON vào đây...&#10;Ví dụ: {"name": "eztool", "status": "active"}'></textarea>
                    </div>

                    <!-- Khung Kết quả (Output) -->
                    <div class="flex flex-col bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden relative">
                        <div class="h-10 border-b border-slate-200 bg-slate-50/50 flex items-center justify-between px-3 flex-shrink-0">
                            <span class="text-xs font-semibold text-slate-500 uppercase">Output</span>
                            <button id="btn-copy" class="text-xs text-slate-500 hover:text-slate-900 flex items-center transition-colors">
                                <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                Copy
                            </button>
                        </div>
                        <textarea id="output-json" class="flex-1 w-full p-4 font-mono text-sm resize-none bg-slate-50/30 focus:outline-none focus:ring-inset focus:ring-2 focus:ring-blue-500/50 text-slate-800" readonly placeholder='Kết quả sẽ hiển thị tại đây...'></textarea>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification (Ẩn mặc định) -->
    <div id="toast" class="fixed bottom-4 right-4 bg-slate-900 text-white px-4 py-3 rounded-md shadow-lg flex items-center text-sm font-medium z-50 hidden toast-enter">
        <svg class="w-5 h-5 text-green-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toast-msg">Đã copy vào Clipboard!</span>
    </div>

    <!-- Script điều khiển Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputJson = document.getElementById('input-json');
            const outputJson = document.getElementById('output-json');
            const btnFormat = document.getElementById('btn-format');
            const btnMinify = document.getElementById('btn-minify');
            const btnClear = document.getElementById('btn-clear');
            const btnCopy = document.getElementById('btn-copy');
            const btnPaste = document.getElementById('btn-paste');
            const toast = document.getElementById('toast');
            
            // Logic xử lý JSON
            const processJson = (isMinify = false) => {
                const rawVal = inputJson.value.trim();
                if (!rawVal) {
                    outputJson.value = '';
                    outputJson.classList.remove('text-red-500');
                    return;
                }
                
                try {
                    const parsed = JSON.parse(rawVal);
                    outputJson.value = isMinify ? JSON.stringify(parsed) : JSON.stringify(parsed, null, 4);
                    outputJson.classList.remove('text-red-500');
                } catch (e) {
                    outputJson.value = "Lỗi định dạng JSON:\n" + e.message;
                    outputJson.classList.add('text-red-500');
                }
            };

            // Sự kiện các nút
            btnFormat.addEventListener('click', () => processJson(false));
            btnMinify.addEventListener('click', () => processJson(true));
            
            btnClear.addEventListener('click', () => {
                inputJson.value = '';
                outputJson.value = '';
                outputJson.classList.remove('text-red-500');
            });

            // Tự động format khi paste vào input (Trải nghiệm Zero-friction)
            inputJson.addEventListener('paste', () => {
                setTimeout(() => processJson(false), 10);
            });

            // Logic Copy
            btnCopy.addEventListener('click', () => {
                if(!outputJson.value || outputJson.classList.contains('text-red-500')) return;
                
                outputJson.select();
                document.execCommand('copy');
                
                // Show Toast
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, 2500);
            });

            // Logic Paste (Lưu ý: API Clipboard có thể bị chặn trên một số trình duyệt nếu không HTTPS)
            btnPaste.addEventListener('click', async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    inputJson.value = text;
                    processJson(false);
                } catch (err) {
                    alert('Không thể truy cập Clipboard. Vui lòng bấm Ctrl+V.');
                }
            });

            // Mobile Menu Toggle
            const btnMenu = document.getElementById('btn-menu');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            const toggleMenu = () => {
                sidebar.classList.toggle('-translate-x-full');
                overlay.classList.toggle('hidden');
            };

            btnMenu.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);
        });
    </script>
</body>
</html>
